      dssat:
        source: SoilNi.OUT
        field: NIAD
        aggregation: last
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        fields:
        - azomes
        - ammomes
        operation: sum
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: SMNmes
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
  cumulative_n_mineralized:
    column: CumNMineralized
    description: Azote mineralise cumule
    type: REAL
    unit: kgN/ha
    required: false
    models:
      dssat:
        source: SoilOrg.OUT
        field: NMNC
        aggregation: last
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: N_mineralisation
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: Qmin
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
  cumulative_n_denitrified:
    column: CumNDenitrified
    description: Azote denitrifie cumule
    type: REAL
    unit: kgN/ha
    required: false
    models:
      dssat:
        source: N2O.OUT
        field: NDNC
