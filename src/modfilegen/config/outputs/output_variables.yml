  cumulative_n_fixed:
    column: CumNFixed
    description: Azote fixe symbiotiquement cumule
    type: REAL
    unit: kgN/ha
    required: false
    models:
      dssat:
        source: Summary.OUT
        field: NFXM
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
