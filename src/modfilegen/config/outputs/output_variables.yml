    type: REAL
    unit: kgN/ha
    models:
      dssat:
        source: Summary.OUT
        field: CNAM
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: QNplante
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: QNplante
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      apsim:
        source: Report
        field: Wheat.Nitrogen.TotalN
        aggregation: last
        source_unit: unknown
        scale: 1.0
        offset: 0.0
        status: unverified
  cumulative_soil_evaporation:
    column: CumE
    description: Evaporation cumulee du sol
    type: REAL
    unit: mm
    models:
      dssat:
        source: Summary.OUT
        field: ESCP
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: ces
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: ces
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
      apsim:
        source: Report
        field: Wheat.Water.Es
        aggregation: last
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: unverified
      celsius:
        source: OutputSynt
        field: SigmaSimEsol
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
      celsiusv32:
        source: OutputSynt
        field: SigmaSimEsol
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
  cumulative_transpiration:
    column: Transp
    description: Transpiration cumulee de la culture
    type: REAL
    unit: mm
    models:
      dssat:
        source: Summary.OUT
        field: EPCP
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: cep
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
