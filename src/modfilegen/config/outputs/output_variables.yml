# Catalogue des variables partagees de SummaryOutput.
# Chaque correspondance regroupe source, unite et conversion.
# Formule: valeur_canonique = valeur_source * scale + offset.

version: 1
summary_output:
  table: SummaryOutput
  schema_mode: extend
  identity_columns:
    Model: TEXT
    IdSim: TEXT
    Texte: TEXT
    SeasonOrder: INTEGER
    PlantOrder: INTEGER
    lon: REAL
    lat: REAL
    time: INTEGER
variables:
  planting:
    column: Planting
    description: Date de semis
    type: INTEGER
    unit: extended_day_index
    models:
      dssat:
        source: Summary.OUT
        field: PDAT
        source_unit: YrDoy
        transform: dssat_extended_day_index
        status: verified
        transform_context:
          standard:
            reference_year: planting_year
          successive:
            reference_year: sequence_start_year
      stics:
        source: mod_rapport.sti
        field: iplts
        source_unit: extended_day_index
        transform: identity
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: iplts
        source_unit: extended_day_index
        transform: identity
        status: verified
      celsius:
        source: OutputSynt
        field: iplt
        source_unit: simulation_day
        transform: identity
        status: verified
      celsiusv32:
        source: OutputSynt
        field: iplt
        source_unit: simulation_day
        transform: identity
        status: verified
  emergence:
    column: Emergence
    description: Date de levee
    type: INTEGER
    unit: extended_day_index
    models:
      dssat:
        source: Summary.OUT
        field: EDAT
        source_unit: YrDoy
        transform: dssat_extended_day_index
        status: verified
        transform_context:
          standard:
            reference_year: planting_year
          successive:
            reference_year: sequence_start_year
      stics:
        source: mod_rapport.sti
        field: ilevs
        source_unit: extended_day_index
        transform: identity
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: ilevs
        source_unit: extended_day_index
        transform: identity
        status: verified
      celsius:
        source: OutputSynt
        field: JulPheno1_1
        source_unit: simulation_day
        transform: identity
        status: verified
      celsiusv32:
        source: OutputSynt
        field: JulPheno1_1
        source_unit: simulation_day
        transform: identity
        status: verified
  anthesis:
    column: Ant
    description: Date de floraison ou d'anthese
    type: INTEGER
    unit: extended_day_index
    models:
      dssat:
        source: Summary.OUT
        field: ADAT
        source_unit: YrDoy
        transform: dssat_extended_day_index
        status: verified
        transform_context:
          standard:
            reference_year: planting_year
          successive:
            reference_year: sequence_start_year
      stics:
        source: mod_rapport.sti
        field: iflos
        source_unit: extended_day_index
        transform: identity
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: iflos
        source_unit: extended_day_index
        transform: identity
        status: verified
      celsius:
        source: OutputSynt
        field: JulPheno1_4
        source_unit: simulation_day
        transform: identity
        status: verified
      celsiusv32:
        source: OutputSynt
        field: JulPheno1_4
        source_unit: simulation_day
        transform: identity
        status: verified
  maturity:
    column: Mat
    description: Date de maturite
    type: INTEGER
    unit: extended_day_index
    models:
      dssat:
        source: Summary.OUT
        field: MDAT
        source_unit: YrDoy
        transform: dssat_extended_day_index
        status: verified
        transform_context:
          standard:
            reference_year: planting_year
          successive:
            reference_year: sequence_start_year
      stics:
        source: mod_rapport.sti
        field: imats
        source_unit: extended_day_index
        transform: identity
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: imats
        source_unit: extended_day_index
        transform: identity
        status: verified
      celsius:
        source: OutputSynt
        field: JulPheno1_6
        source_unit: simulation_day
        transform: identity
        status: verified
      celsiusv32:
        source: OutputSynt
        field: JulPheno1_6
        source_unit: simulation_day
        transform: identity
        status: verified
  biomass_at_maturity:
    column: Biom_ma
    description: Biomasse aerienne a maturite
    type: REAL
    unit: kgDM/ha
    models:
      dssat:
        source: Summary.OUT
        field: CWAM
        source_unit: kgDM/ha
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: masec(n)
        source_unit: tDM/ha
        scale: 1000.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: masec(n)
        source_unit: tDM/ha
        scale: 1000.0
        offset: 0.0
        status: verified
      apsim:
        source: Report
        field: Wheat.AboveGround.Wt
        aggregation: last
        source_unit: unknown
        scale: 1.0
        offset: 0.0
        status: unverified
      celsius:
        source: OutputSynt
        field: Biom(nrec)
        source_unit: tDM/ha
        scale: 1000.0
        offset: 0.0
        status: verified
      celsiusv32:
        source: OutputSynt
        field: Biom(nrec)
        source_unit: tDM/ha
        scale: 1000.0
        offset: 0.0
        status: verified
  yield:
    column: Yield
    description: Rendement recolte
    type: REAL
    unit: tDM/ha
    models:
      dssat:
        source: Summary.OUT
        field: HWAM
        source_unit: kgDM/ha
        scale: 0.001
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: mafruit
        source_unit: tDM/ha
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: mafruit
        source_unit: tDM/ha
        scale: 1.0
        offset: 0.0
        status: verified
      apsim:
        source: Report
        field: Wheat.Grain.Wt
        aggregation: last
        source_unit: unknown
        scale: 1.0
        offset: 0.0
        status: unverified
      celsius:
        source: OutputSynt
        field: Grain(nrec)
        source_unit: tDM/ha
        scale: 1.0
        offset: 0.0
        status: verified
      celsiusv32:
        source: OutputSynt
        field: Grain(nrec)
        source_unit: tDM/ha
        scale: 1.0
        offset: 0.0
        status: verified
  fresh_yield:
    column: FreshYield
    description: Rendement frais a la recolte
    type: REAL
    unit: tFW/ha
    required: false
    models:
      dssat:
        source: Summary.OUT
        field: FHWAM
        source_unit: kgFW/ha
        scale: 0.001
        offset: 0.0
        missing_values:
        - -99
        status: verified
  grain_number:
    column: GNumber
    description: Nombre de grains
    type: REAL
    unit: count/m2
    models:
      dssat:
        source: Summary.OUT
        field: H#AM
        source_unit: count/m2
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: chargefruit
        source_unit: count/m2
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: chargefruit
        source_unit: count/m2
        scale: 1.0
        offset: 0.0
        status: verified
      apsim:
        source: Report
        field: Wheat.Grain.Number
        aggregation: last
        source_unit: unknown
        scale: 1.0
        offset: 0.0
        status: unverified
      celsius:
        source: OutputSynt
        field: Ngrain
        source_unit: count/m2
        scale: 1.0
        offset: 0.0
        status: verified
      celsiusv32:
        source: OutputSynt
        field: Ngrain
        source_unit: count/m2
        scale: 1.0
        offset: 0.0
        status: verified
  grain_n_at_maturity:
    column: GrainN_ma
    description: Azote des grains ou organes recoltes a maturite
    type: REAL
    unit: kgN/ha
    required: false
    models:
      dssat:
        source: Summary.OUT
        field: GNAM
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: QNgrain
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: QNgrain
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
  maximum_lai:
    column: MaxLAI
    description: Indice foliaire maximal
    type: REAL
    unit: m2/m2
    models:
      dssat:
        source: Summary.OUT
        field: LAIX
        source_unit: m2/m2
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: laimax
        source_unit: m2/m2
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: laimax
        source_unit: m2/m2
        scale: 1.0
        offset: 0.0
        status: verified
      apsim:
        source: Report
        field: Wheat.Leaf.MaximumLAI
        aggregation: last
        source_unit: m2/m2
        scale: 1.0
        offset: 0.0
        status: unverified
      celsius:
        source: OutputSynt
        field: LAI
        source_unit: m2/m2
        scale: 1.0
        offset: 0.0
        status: verified
      celsiusv32:
        source: OutputSynt
        field: LAI
        source_unit: m2/m2
        scale: 1.0
        offset: 0.0
        status: verified
  nitrogen_leaching:
    column: Nleac
    description: Lessivage cumule d'azote
    type: REAL
    unit: kgN/ha
    models:
      dssat:
        source: Summary.OUT
        field: NLCM
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: leaching_from_plt
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: leaching_from_plt
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      apsim:
        source: Report
        field: Wheat.Nitrogen.NLeached
        aggregation: last
        source_unit: unknown
        scale: 1.0
        offset: 0.0
        status: unverified
  soil_nitrogen:
    column: SoilN
    description: Azote mineral du sol
    type: REAL
    unit: kgN/ha
    models:
      dssat:
        source: Summary.OUT
        field: NIAM
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        fields:
        - azomes
        - ammomes
        operation: sum
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: SMNmes
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      apsim:
        source: Report
        field: Wheat.Nitrogen.SoilN
        aggregation: last
        source_unit: unknown
        scale: 1.0
        offset: 0.0
        status: unverified
      celsius:
        source: OutputSynt
        field: stockNsol
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: unverified
      celsiusv32:
        source: OutputSynt
        field: stockNsol
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: unverified
  crop_nitrogen_at_maturity:
