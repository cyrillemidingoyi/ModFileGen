        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: Qem_N2O
        source_unit: kgN/ha
        scale: 1.0
        offset: 0.0
        status: verified
  potential_irrigation_requirement:
    column: PotentialIrrigationRequirement
    description: Besoin potentiel d'irrigation pour eviter le stress hydrique, hors pertes et sans contrainte de disponibilite en eau
    type: REAL
    unit: mm
    required: false
    interpretation_condition: automatic_irrigation_unconstrained
    models:
      dssat:
        source: WaterBal.OUT
        field: IRRC
        aggregation: last
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: totir
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: totir
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
