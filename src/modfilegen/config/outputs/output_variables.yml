        source: OutputSynt
        field: SigmaTranspiMC
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
      celsiusv32:
        source: OutputSynt
        field: SigmaTranspiMC
        source_unit: mm
        scale: 1.0
        offset: 0.0
        status: verified
  harvest_date:
    column: Harvest
    description: Date de recolte
    type: INTEGER
    unit: extended_day_index
    required: false
    models:
      dssat:
        source: Summary.OUT
        field: HDAT
        source_unit: YrDoy
        transform: dssat_extended_day_index
        status: verified
        transform_context:
          standard:
            reference_year: planting_year
          successive:
            reference_year: sequence_start_year
      stics:
        source: mod_rapport.sti
        field: irecs
        source_unit: extended_day_index
        transform: identity
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: irecs
        source_unit: extended_day_index
        transform: identity
        status: verified
  leaf_biomass_at_harvest:
    column: LeafBiomass
    description: Biomasse foliaire a la recolte
    type: REAL
    unit: tDM/ha
    required: false
    models:
      dssat:
        source: Summary.OUT
        field: LWAH
        source_unit: kgDM/ha
        status: invalid
        reason: LWAH is not emitted in Summary.OUT; derive LWAD at HDAT from PlantGro.OUT
      stics:
        source: mod_rapport.sti
        field: mafeuil
        source_unit: tDM/ha
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: mafeuil
        source_unit: tDM/ha
        scale: 1.0
        offset: 0.0
        status: verified
  root_biomass:
    column: RootBiomass
    description: Biomasse racinaire
    type: REAL
    unit: tDM/ha
    required: false
    models:
      dssat:
        source: PlantGro.OUT
        field: RWAD
        aggregation: last
        source_unit: kgDM/ha
        scale: 0.001
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: msrac(n)
        source_unit: tDM/ha
        status: invalid
        reason: end-of-cycle live root biomass is reset to zero; derive from daily output
      sticsv11:
        source: mod_rapport.sti
        field: msrac(n)
        source_unit: tDM/ha
        scale: 1.0
        offset: 0.0
        status: verified
  maximum_root_depth:
    column: MaxRootDepth
    description: Profondeur racinaire maximale
    type: REAL
    unit: cm
    required: false
    models:
      dssat:
        source: PlantGro.OUT
        field: RDPD
        aggregation: max
        source_unit: m
        scale: 100.0
        offset: 0.0
        status: verified
      stics:
        source: mod_rapport.sti
        field: zrac
        aggregation: max
        source_unit: cm
        scale: 1.0
        offset: 0.0
        status: verified
      sticsv11:
        source: mod_rapport.sti
        field: zrac
        aggregation: max
        source_unit: cm
        scale: 1.0
        offset: 0.0
        status: verified
